<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#14213d"><title>RUNLU Warehouse OS — Sign In</title><style>:root{--navy:#14213d;--blue:#2563eb;--bg:#f3f5f8;--card:#fff;--text:#182033;--muted:#6f7785;--line:#e2e7ef;--red:#a32638}*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;color:var(--text)}header{background:var(--navy);color:#fff;padding:22px 18px}header>div,main{max-width:560px;margin:auto}.eyebrow{font-size:11px;opacity:.72;text-transform:uppercase;letter-spacing:.08em}h1{font-size:25px;margin:6px 0 4px}header p{font-size:13px;opacity:.8;margin:0;line-height:1.45}main{padding:18px 14px 70px}.card{background:#fff;border-radius:20px;padding:18px;box-shadow:0 1px 8px rgba(20,31,52,.08)}label{display:block;font-size:12px;color:var(--muted);margin:12px 0 5px}input{width:100%;border:1px solid var(--line);border-radius:12px;padding:13px;font:inherit;background:#fff}button{width:100%;border:0;border-radius:13px;padding:14px;margin-top:16px;background:var(--blue);color:#fff;font:inherit;font-weight:800}.meta{font-size:12px;color:var(--muted);line-height:1.55}.error{display:none;margin-top:12px;padding:11px;border-radius:11px;background:#fff0f2;color:var(--red);font-size:12px}.error.show{display:block}.footer{text-align:center;font-size:11px;color:var(--muted);margin-top:16px}</style></head><body><header><div><div class="eyebrow">Universal Edition</div><h1>Sign in to Warehouse OS</h1><p>Local account access. Your warehouse data stays on this device unless your organization later connects its own cloud service.</p></div></header><main><section class="card"><div id="workspace" class="meta"></div><form id="form"><label>Username</label><input id="username" autocomplete="username" autocapitalize="none" spellcheck="false" required><label>PIN</label><input id="pin" type="password" inputmode="numeric" pattern="[0-9]*" autocomplete="current-password" minlength="4" maxlength="8" required><button type="submit">Sign In</button><div id="error" class="error"></div></form></section><div class="footer">RUNLU Warehouse OS · Customer-owned local storage</div></main><script src="runtime-config.js"></script><script src="workspace.js"></script><script src="local-auth.js"></script><script>(function(){const $=id=>document.getElementById(id);if(!RUNLUWorkspace.isReady()){location.replace('onboarding.html');return}if(!RUNLULocalAuth.hasUsers()){location.replace('onboarding.html');return}const active=RUNLUWorkspace.ensureSession()&&RUNLULocalAuth.currentUser();if(active){location.replace('preview.html');return}const ws=RUNLUWorkspace.workspace();$('workspace').innerHTML='<b>'+esc(ws.config?.company?.name||'Company')+'</b><br>'+esc(ws.config?.warehouse?.name||'Warehouse');$('username').value=localStorage.getItem('runlu-universal-v1::last-username')||'';$('form').addEventListener('submit',async e=>{e.preventDefault();$('error').classList.remove('show');try{await RUNLULocalAuth.authenticate($('username').value,$('pin').value);location.replace('preview.html')}catch(err){$('pin').value='';$('error').textContent=String(err?.message||err);$('error').classList.add('show')}});function esc(v){return String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}})();</script></body></html>
