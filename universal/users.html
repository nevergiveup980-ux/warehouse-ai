<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#14213d"><title>RUNLU Warehouse OS — Users</title><style>:root{--navy:#14213d;--blue:#2563eb;--bg:#f3f5f8;--card:#fff;--text:#182033;--muted:#6f7785;--line:#e2e7ef;--green:#17854b;--red:#a32638}*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;color:var(--text)}header{background:var(--navy);color:#fff;padding:16px}header>div,main{max-width:760px;margin:auto}.top{display:flex;align-items:center;justify-content:space-between;gap:10px}h1{font-size:21px;margin:0}.top a{color:#fff;text-decoration:none;background:rgba(255,255,255,.12);padding:7px 9px;border-radius:9px;font-size:11px}.sub{font-size:12px;color:var(--muted);line-height:1.5}main{padding:14px 13px 70px}.card{background:#fff;border-radius:18px;padding:16px;margin-bottom:12px;box-shadow:0 1px 7px rgba(20,31,52,.08)}h2{font-size:17px;margin:0 0 10px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.full{grid-column:1/-1}label{display:block;font-size:12px;color:var(--muted);margin-bottom:5px}input,select{width:100%;border:1px solid var(--line);border-radius:11px;padding:11px;font:inherit;background:#fff}button{border:0;border-radius:11px;padding:10px 12px;font:inherit;font-weight:750;background:#e9edf3;color:var(--text)}button.primary{background:var(--blue);color:#fff}.user{border-top:1px solid var(--line);padding:12px 0;display:flex;gap:10px;justify-content:space-between;align-items:center}.user:first-child{border-top:0}.user b{display:block}.meta{font-size:11px;color:var(--muted);line-height:1.45}.badge{display:inline-block;padding:4px 7px;border-radius:999px;background:#eef5ff;color:#244da0;font-size:10px;font-weight:800;margin-left:5px}.disabled{opacity:.5}.actions{display:flex;gap:7px;flex-wrap:wrap;justify-content:flex-end}.msg{display:none;margin-top:10px;padding:10px;border-radius:10px;font-size:12px}.msg.show{display:block}.ok{background:#edf9f2;color:#176b40}.err{background:#fff0f2;color:var(--red)}@media(max-width:560px){.grid{grid-template-columns:1fr}.full{grid-column:auto}.user{align-items:flex-start;flex-direction:column}.actions{justify-content:flex-start}}</style></head><body><header><div class="top"><h1>Local Users & Access</h1><a href="preview.html">Warehouse OS</a></div></header><main><section class="card"><h2>Signed in</h2><div id="current" class="sub"></div><div style="margin-top:10px"><button id="signOut">Sign Out</button></div></section><section id="manageCard" class="card"><h2>Add local user</h2><div class="sub">Accounts are stored only in this workspace on this device. PINs are stored as one-way salted hashes, not plain text.</div><form id="createForm" class="grid" style="margin-top:12px"><div><label>Display name</label><input id="displayName" required></div><div><label>Username</label><input id="username" autocapitalize="none" spellcheck="false" required></div><div><label>PIN (4–8 digits)</label><input id="pin" type="password" inputmode="numeric" minlength="4" maxlength="8" pattern="[0-9]*" required></div><div><label>Role</label><select id="role"><option value="admin">Administrator</option><option value="manager">Manager</option><option value="member" selected>Staff</option><option value="viewer">Viewer</option></select></div><div class="full"><label>Email (optional reference only)</label><input id="email" type="email"></div><div class="full"><button class="primary" type="submit">Create Local User</button></div></form><div id="msg" class="msg"></div></section><section class="card"><h2>Users</h2><div id="users"></div></section></main><script src="workspace.js"></script><script src="local-auth.js"></script><script>(function(){const $=id=>document.getElementById(id);if(!RUNLUWorkspace.isReady()){location.replace('onboarding.html');return}if(!RUNLUWorkspace.ensureSession()||!RUNLULocalAuth.currentUser()){location.replace('sign-in.html');return}const current=RUNLULocalAuth.currentUser(),canManage=RUNLUWorkspace.can('manageMembers');$('current').innerHTML='<b>'+esc(current.displayName)+'</b> · '+esc(labelRole(current.role))+'<br>@'+esc(current.username);if(!canManage)$('manageCard').style.display='none';$('signOut').onclick=()=>{RUNLULocalAuth.signOut();location.replace('sign-in.html')};$('createForm').addEventListener('submit',async e=>{e.preventDefault();try{await RUNLULocalAuth.createUser({displayName:$('displayName').value,username:$('username').value,pin:$('pin').value,email:$('email').value,role:$('role').value});$('createForm').reset();$('role').value='member';show('Local user created.',true);render()}catch(err){show(String(err?.message||err),false)}});function render(){const users=RUNLULocalAuth.listUsers();$('users').innerHTML=users.map(u=>'<div class="user '+(u.disabled?'disabled':'')+'"><div><b>'+esc(u.displayName)+' <span class="badge">'+esc(labelRole(u.role))+'</span></b><div class="meta">@'+esc(u.username)+(u.email?' · '+esc(u.email):'')+(u.disabled?' · Disabled':'')+'</div></div><div class="actions">'+(canManage&&u.role!=='owner'?'<button data-toggle="'+esc(u.id)+'">'+(u.disabled?'Enable':'Disable')+'</button><button data-pin="'+esc(u.id)+'">Reset PIN</button><button data-delete="'+esc(u.id)+'">Delete</button>':'')+'</div></div>').join('');document.querySelectorAll('[data-toggle]').forEach(b=>b.onclick=()=>{try{const u=users.find(x=>x.id===b.dataset.toggle);RUNLULocalAuth.setDisabled(u.id,!u.disabled);render()}catch(e){show(String(e.message||e),false)}});document.querySelectorAll('[data-pin]').forEach(b=>b.onclick=async()=>{const pin=prompt('Enter a new 4–8 digit PIN.');if(pin==null)return;try{await RUNLULocalAuth.setPin(b.dataset.pin,pin);show('PIN updated.',true)}catch(e){show(String(e.message||e),false)}});document.querySelectorAll('[data-delete]').forEach(b=>b.onclick=()=>{if(!confirm('Delete this local user?'))return;try{RUNLULocalAuth.removeUser(b.dataset.delete);render()}catch(e){show(String(e.message||e),false)}})}function show(text,ok){$('msg').textContent=text;$('msg').className='msg show '+(ok?'ok':'err');setTimeout(()=>$('msg').className='msg',3000)}function labelRole(r){return r==='member'?'Staff':r.charAt(0).toUpperCase()+r.slice(1)}function esc(v){return String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}render()})();</script></body></html>
