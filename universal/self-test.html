<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Universal V1 Safety Tests</title><style>body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;max-width:760px;margin:0 auto;padding:22px;background:#f3f5f8;color:#182033}.card{background:#fff;border-radius:16px;padding:16px;margin:10px 0}h1{font-size:22px}.pass{color:#177245}.fail{color:#b42335}button,a{border:0;border-radius:10px;padding:11px 13px;background:#2563eb;color:#fff;text-decoration:none;font:inherit}.row{padding:8px 0;border-top:1px solid #e2e7ef}.row:first-child{border-top:0}.muted{color:#6f7785;font-size:12px}</style></head><body><h1>Universal V1 Safety Tests</h1><div class="card"><p class="muted">Runs only against temporary <code>runlu-universal-v1::</code> keys and restores the current development workspace afterward.</p><button id="run">Run isolation tests</button> <a href="index.html">Back</a></div><div id="out" class="card"></div><script src="runtime-config.js"></script><script src="workspace.js"></script><script src="storage-adapter.js"></script><script src="core-adapter.js"></script><script>(function(){const out=document.getElementById('out'),W=RUNLUWorkspace,U=RUNLUUniversal,S=RUNLUUniversalStorage,C=RUNLUCoreAdapter;function line(ok,name,detail){out.insertAdjacentHTML('beforeend','<div class="row '+(ok?'pass':'fail')+'"><b>'+(ok?'PASS':'FAIL')+'</b> · '+name+(detail?'<div class="muted">'+detail+'</div>':'')+'</div>')}function ws(org,wh,name){return {schemaVersion:1,mode:'self-test',organizationId:org,warehouseId:wh,createdAt:new Date().toISOString(),config:U.createRuntimeConfig({company:{name,websiteUrl:'https://example.com'},warehouse:{name:'Main',code:'MAIN'},features:{inventory:true}})}}function putWorkspace(x,user,role){localStorage.setItem(W.WORKSPACE_KEY,JSON.stringify(x));localStorage.setItem(W.SESSION_KEY,JSON.stringify({organizationId:x.organizationId,warehouseId:x.warehouseId,userId:user,role,displayName:user}))}document.getElementById('run').onclick=()=>{out.innerHTML='';const oldW=localStorage.getItem(W.WORKSPACE_KEY),oldS=localStorage.getItem(W.SESSION_KEY),created=[];try{const a=ws('test-org-a','test-wh-a','Alpha'),b=ws('test-org-b','test-wh-b','Beta');putWorkspace(a,'user-a','owner');S.seedEmpty();C.save('productMaster',[{id:'A'}]);const keyA=S.key(U.LEGACY_DATASETS.productMaster);created.push(...S.list().map(x=>x.scopedKey),S.key('__runlu_universal_audit_v1'));putWorkspace(b,'user-b','owner');S.seedEmpty();C.save('productMaster',[{id:'B'}]);const keyB=S.key(U.LEGACY_DATASETS.productMaster);created.push(...S.list().map(x=>x.scopedKey),S.key('__runlu_universal_audit_v1'));line(keyA!==keyB,'Tenant storage keys differ',keyA+' vs '+keyB);line(C.load('productMaster')[0]?.id==='B','Workspace B reads only B data');putWorkspace(a,'user-a','owner');line(C.load('productMaster')[0]?.id==='A','Workspace A still reads only A data');putWorkspace(a,'viewer-a','viewer');let blocked=false;try{C.save('productMaster',[{id:'X'}])}catch(_){blocked=true}line(blocked,'Viewer write is blocked');putWorkspace(a,'user-a','owner');line(C.tagBaseUrl()==='https://example.com/','Company website resolves tag base URL',C.tagBaseUrl());line(W.trialState().status==='trial','Fresh workspace starts in trial');line(C.compatibility().datasets.length===Object.keys(U.LEGACY_DATASETS).length,'Mature dataset compatibility map is complete',String(C.compatibility().datasets.length)+' datasets')}catch(e){line(false,'Unexpected test exception',String(e&&e.message||e))}finally{for(const k of new Set(created))localStorage.removeItem(k);if(oldW===null)localStorage.removeItem(W.WORKSPACE_KEY);else localStorage.setItem(W.WORKSPACE_KEY,oldW);if(oldS===null)localStorage.removeItem(W.SESSION_KEY);else localStorage.setItem(W.SESSION_KEY,oldS)}}})();</script></body></html>
