<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#14213d"><title>Universal V1 Settings</title><style>:root{--navy:#14213d;--blue:#2563eb;--bg:#f3f5f8;--card:#fff;--text:#182033;--muted:#6f7785;--line:#e2e7ef;--green:#17854b}*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;color:var(--text)}header{background:var(--navy);color:#fff;padding:16px}header>div,main{max-width:760px;margin:auto}h1{font-size:21px;margin:0}.sub{font-size:12px;color:var(--muted);line-height:1.5}.topsub{font-size:12px;opacity:.75;margin-top:4px}main{padding:14px 13px 70px}.card{background:#fff;border-radius:18px;padding:16px;margin-bottom:12px;box-shadow:0 1px 7px rgba(20,31,52,.08)}h2{font-size:17px;margin:0 0 12px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.full{grid-column:1/-1}label{display:block;font-size:12px;color:var(--muted);margin-bottom:5px}input,select{width:100%;border:1px solid var(--line);border-radius:11px;padding:11px;font:inherit;background:#fff}.check{display:flex;align-items:center;gap:9px;border-top:1px solid var(--line);padding:10px 0}.check:first-child{border-top:0}.check input{width:auto}.actions{display:flex;gap:8px;flex-wrap:wrap}button,a{border:0;border-radius:11px;padding:11px 13px;font:inherit;text-decoration:none;background:#e9edf3;color:var(--text);font-weight:750}button.primary{background:var(--blue);color:#fff}.saved{display:none;background:#edf9f2;color:#176b40;padding:11px;border-radius:11px;font-size:12px;margin-top:10px}.saved.show{display:block}@media(max-width:560px){.grid{grid-template-columns:1fr}.full{grid-column:auto}}</style></head><body><header><div><h1>Company & Warehouse Settings</h1><div class="topsub">Universal V1 · configuration only · production remains untouched</div></div></header><main><form id="form"><section class="card"><h2>Company</h2><div class="grid"><div class="full"><label>Company name</label><input id="companyName" required></div><div><label>Website</label><input id="website" type="url"></div><div><label>Support email</label><input id="supportEmail" type="email"></div><div><label>Currency</label><select id="currency"><option>USD</option><option>CAD</option><option>EUR</option><option>GBP</option><option>AUD</option><option>NZD</option></select></div><div><label>Language</label><select id="locale"><option value="en">English</option><option value="fr">Français</option><option value="es">Español</option><option value="zh">中文</option></select></div><div class="full"><label>Timezone</label><input id="timezone"></div></div></section><section class="card"><h2>Warehouse</h2><div class="grid"><div><label>Name</label><input id="warehouseName" required></div><div><label>Code</label><input id="warehouseCode" required></div><div><label>Default low-stock quantity</label><input id="lowStock" type="number" min="0" step="1"></div><div><label>Carpet low-stock feet</label><input id="carpetLow" type="number" min="0" step="1"></div><div><label>Cut allowance inches</label><input id="cutInches" type="number" min="0" step="0.25"></div><div><label>Tag base URL</label><input id="tagBaseUrl" type="url"></div></div></section><section class="card"><h2>Modules</h2><div id="features"></div></section><section class="card"><div class="actions"><button class="primary" type="submit">Save Universal Settings</button><a href="index.html">Back to workspace</a></div><div id="saved" class="saved">Settings saved to this Universal V1 workspace.</div></section></form></main><script src="runtime-config.js"></script><script src="workspace.js"></script><script src="storage-adapter.js"></script><script src="core-adapter.js"></script><script>(function(){const $=id=>document.getElementById(id);if(!RUNLUWorkspace.isReady()){location.replace('onboarding.html');return}RUNLUWorkspace.ensureSession();if(!RUNLUWorkspace.can('manageWarehouse')){alert('Administrator role required for company and warehouse settings.');location.replace('index.html');return}const ws=RUNLUWorkspace.workspace(),cfg=ws.config,cfgCompany=cfg.company||{},cfgWh=cfg.warehouse||{};const map=[['companyName',cfgCompany.name],['website',cfgCompany.websiteUrl],['supportEmail',cfgCompany.supportEmail],['currency',cfgCompany.currency],['locale',cfgCompany.locale],['timezone',cfgCompany.timezone],['warehouseName',cfgWh.name],['warehouseCode',cfgWh.code],['lowStock',cfgWh.lowStock?.defaultQuantity],['carpetLow',cfgWh.lowStock?.carpetFeet],['cutInches',cfgWh.cutAllowance?.inches],['tagBaseUrl',cfgWh.tagBaseUrl]];map.forEach(([id,v])=>{if(v!==undefined&&v!==null)$(id).value=v});const labels={inventory:'Inventory',receiving:'Receiving',transfer:'Transfer',cutPick:'Cut / Pick',shipping:'Shipping',returns:'Returns',purchaseOrders:'PO / Orders',historyAudit:'History / Audit',barcodeQr:'Barcode / QR',commandCenter:'Today Command Center',lowStockAlerts:'Low-stock alerts',warehouseMap:'Warehouse Map',multiDeviceSync:'Multi-device Sync',carpetIndustryTemplate:'Flooring template'};$('features').innerHTML=Object.entries(labels).map(([k,v])=>'<label class="check"><input type="checkbox" data-feature="'+k+'" '+(cfg.features?.[k]?'checked':'')+'><span>'+v+'</span></label>').join('');$('form').addEventListener('submit',e=>{e.preventDefault();const company={...cfgCompany,name:$('companyName').value.trim(),websiteUrl:$('website').value.trim(),supportEmail:$('supportEmail').value.trim(),currency:$('currency').value,locale:$('locale').value,timezone:$('timezone').value.trim()},warehouse={...cfgWh,name:$('warehouseName').value.trim(),code:$('warehouseCode').value.trim().toUpperCase(),tagBaseUrl:$('tagBaseUrl').value.trim(),lowStock:{enabled:true,defaultQuantity:Number($('lowStock').value||0),carpetFeet:Number($('carpetLow').value||0)},cutAllowance:{enabled:Number($('cutInches').value||0)>0,inches:Number($('cutInches').value||0)}},features={...cfg.features};document.querySelectorAll('[data-feature]').forEach(x=>features[x.dataset.feature]=x.checked);const nextConfig=RUNLUUniversal.createRuntimeConfig({product:cfg.product,company,warehouse,features});RUNLUWorkspace.updateWorkspace({config:nextConfig});RUNLUCoreAdapter.appendAudit({eventType:'workspace.settings.updated',entityType:'warehouse',entityId:ws.warehouseId,payload:{warehouseCode:warehouse.code}});$('saved').classList.add('show');setTimeout(()=>$('saved').classList.remove('show'),2500)})})();</script></body></html>
