name: Warehouse Release Engineering Gate

on:
  pull_request:
    paths:
      - '*.js'
      - 'index.html'
      - 'release-loader.js'
      - 'version.json'
      - 'tests/**'
      - '.github/workflows/warehouse-release-engineering-gate.yml'
  workflow_dispatch:

jobs:
  engineering-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: JavaScript syntax gate
        run: |
          node --check build124-shared-carpet-physical-identity.js
          node --check build125-pending-carpet-placeholder-adoption.js
          node --check build126-finalize-pending-carpet-arrival.js
          node --check build127-carpet-receiving-guard-authority.js
          node --check build128-carpet-cloud-identity-authority.js
          node --check build129-operation-draft-resilience.js
          node --check build130-local-save-retry-authority.js
          node --check build131-storage-quota-recovery.js
          node --check build132-navigation-quota-guard.js
          node --check build133-cloud-first-pilot.js
          node --check build134-shared-carpet-edit-cloud-confirm.js
          node --check build082-version-authority.js
          node --check release-loader.js
      - name: Business workflow regression gate
        run: |
          node tests/build120-carpet-receiving-cloud-identity.mjs
          node tests/build120-carpet-receiving-completion-guard.mjs
          node tests/build124-shared-carpet-physical-identity.mjs
          node tests/build125-pending-carpet-placeholder-adoption.mjs
          node tests/build126-finalize-pending-carpet-arrival.mjs
          node tests/build127-carpet-receiving-guard-authority.mjs
          node tests/build128-carpet-cloud-identity-authority.mjs
          node tests/build129-operation-draft-resilience.mjs
          node tests/build130-local-save-retry-authority.mjs
          node tests/build131-storage-quota-recovery.mjs
          node tests/build132-navigation-quota-guard.mjs
          node tests/build133-cloud-first-pilot.mjs
          node tests/build134-shared-carpet-edit-cloud-confirm.mjs
      - name: Release manifest consistency
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import assert from 'node:assert/strict';
          const version=JSON.parse(fs.readFileSync('version.json','utf8'));
          const loader=fs.readFileSync('release-loader.js','utf8');
          const authority=fs.readFileSync('build082-version-authority.js','utf8');
          assert.equal(version.build,'134');
          assert.equal(version.version,'6.13.1');
          assert.match(loader,/const RELEASE='134'/);
          assert.match(loader,/build134-shared-carpet-edit-cloud-confirm\.js/);
          assert.match(authority,/version:'6\.13\.1', build:'134'/);
          console.log('Release manifest consistency: PASS');
          NODE
