name: Offline Queue Audit Safety
on:
  pull_request:
    paths:
      - 'tools/offline-queue-audit.html'
      - 'tests/test_offline_queue_audit_contract.py'
      - 'tests/test_offline_queue_audit_static.py'
      - 'tests/test_offline_queue_audit_browser.py'
      - '.github/workflows/offline-queue-audit.yml'
  workflow_dispatch:
jobs:
  safety:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install browser test dependencies
        run: |
          python -m pip install playwright==1.56.0
          python -m playwright install --with-deps chromium webkit
      - name: Contract, security and Chromium smoke checks
        run: python -m unittest discover -s tests -p 'test_offline_queue_audit_*.py' -v
      - name: WebKit (Safari engine) smoke checks
        env:
          RUNLU_TEST_BROWSER: webkit
        run: python -m unittest discover -s tests -p 'test_offline_queue_audit_browser.py' -v
