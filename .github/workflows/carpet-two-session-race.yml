name: Carpet two-session disposable PostgreSQL race

on:
  pull_request:
    paths:
      - 'docs/proposals/carpet-duplicate-insert-guard.REVIEW_ONLY.sql'
      - 'tests/carpet-two-session-race.py'
      - '.github/workflows/carpet-two-session-race.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  disposable-race:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: testonly
          POSTGRES_DB: runlu_disposable
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d runlu_disposable"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      RUNLU_DISPOSABLE_PG_DSN: postgresql://postgres:testonly@127.0.0.1:5432/runlu_disposable
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install PostgreSQL client
        run: sudo apt-get update -qq && sudo apt-get install -y postgresql-client
      - name: Create disposable fixture
        run: |
          psql "$RUNLU_DISPOSABLE_PG_DSN" -X -v ON_ERROR_STOP=1 <<'SQL'
          CREATE TABLE public.warehouse_records (
            user_id uuid NOT NULL,
            dataset_key text NOT NULL,
            record_id text PRIMARY KEY,
            payload jsonb NOT NULL DEFAULT '{}'::jsonb,
            deleted_at timestamptz
          );
          SQL
      - name: Install exact REVIEW_ONLY guard in disposable fixture
        run: psql "$RUNLU_DISPOSABLE_PG_DSN" -X -v ON_ERROR_STOP=1 -f docs/proposals/carpet-duplicate-insert-guard.REVIEW_ONLY.sql
      - name: Race two independent connections
        run: python3 tests/carpet-two-session-race.py
