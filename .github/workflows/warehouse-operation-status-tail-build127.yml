name: Warehouse Operation Status Tail Build127

on:
  pull_request:
    paths:
      - 'build127-operation-status-tail.js'
      - 'qrcode.js'
      - 'tests/build127-operation-status-tail.mjs'
      - '.github/workflows/warehouse-operation-status-tail-build127.yml'
  workflow_dispatch:

jobs:
  status-tail-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: JavaScript syntax
        run: |
          node --check build127-operation-status-tail.js
          node --check qrcode.js
      - name: Status wording regression
        run: node tests/build127-operation-status-tail.mjs
