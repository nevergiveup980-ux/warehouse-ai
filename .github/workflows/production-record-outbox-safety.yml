name: Production Record Outbox Safety
on:
  pull_request:
    paths:
      - 'index.html'
      - 'tests/production-record-outbox-failclosed.test.mjs'
      - '.github/workflows/production-record-outbox-safety.yml'
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tests/production-record-outbox-failclosed.test.mjs
