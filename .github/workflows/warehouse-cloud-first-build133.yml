name: Warehouse Cloud-First Build133

on:
  pull_request:
    paths:
      - 'build133-cloud-first-pilot.js'
      - 'release-loader.js'
      - 'version.json'
      - 'build082-version-authority.js'
      - 'tests/build133-cloud-first-pilot.mjs'
      - '.github/workflows/warehouse-cloud-first-build133.yml'
  workflow_dispatch:

jobs:
  build133-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: JavaScript syntax
        run: |
          node --check build133-cloud-first-pilot.js
          node --check build082-version-authority.js
          node --check release-loader.js
      - name: Cloud-first regression
        run: node tests/build133-cloud-first-pilot.mjs
