name: Emergency Offline Queue Export
on:
  pull_request:
    paths:
      - 'index.html'
      - 'tests/production-emergency-offline-queue-export.test.mjs'
      - 'tests/verified-offline-queue-isolation.test.mjs'
      - '.github/workflows/emergency-offline-queue-export.yml'
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tests/production-emergency-offline-queue-export.test.mjs tests/verified-offline-queue-isolation.test.mjs
