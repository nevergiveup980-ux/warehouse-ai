name: Fix RUNLU Build055 Loader

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-build055-loader.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fix Build055 script placement
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          tag='<script src="build055-hotfix.js"></script>'
          # Remove every accidental copy, including any copy inserted inside a generated Word HTML template.
          s=s.replace(tag+'\n','').replace(tag,'')
          pos=s.rfind('</body>')
          if pos < 0:
              raise SystemExit('real closing body tag not found')
          s=s[:pos]+tag+'\n'+s[pos:]
          p.write_text(s,encoding='utf-8')
          PY

      - name: Validate placement
        shell: bash
        run: |
          set -euo pipefail
          test "$(grep -o 'build055-hotfix.js' index.html | wc -l)" -eq 1
          tail -n 8 index.html | grep -q '<script src="build055-hotfix.js"></script>'
          grep -q "const APP_VERSION='6.5.4', APP_BUILD='055'" index.html
          test -s build055-hotfix.js

      - name: Commit loader fix and remove one-time workflow
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/fix-build055-loader.yml
          git config user.name "RUNLU Build Bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Fix RUNLU Warehouse Build055 runtime loader"
          git push origin HEAD:main
