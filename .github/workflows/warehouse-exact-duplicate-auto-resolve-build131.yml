name: Warehouse Exact Duplicate Auto Resolve Build131

on:
  pull_request:
    paths:
      - 'build131-exact-duplicate-conflict-auto-resolve.js'
      - 'tests/build131-exact-duplicate-conflict-auto-resolve.mjs'
      - 'release-loader.js'
      - 'version.json'
      - 'build082-version-authority.js'
      - '.github/workflows/warehouse-exact-duplicate-auto-resolve-build131.yml'
  push:
    branches: [ main ]
    paths:
      - 'build131-exact-duplicate-conflict-auto-resolve.js'
      - 'tests/build131-exact-duplicate-conflict-auto-resolve.mjs'
      - 'release-loader.js'
      - 'version.json'
      - 'build082-version-authority.js'
      - '.github/workflows/warehouse-exact-duplicate-auto-resolve-build131.yml'

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Syntax check
        run: |
          node --check build131-exact-duplicate-conflict-auto-resolve.js
          node --check tests/build131-exact-duplicate-conflict-auto-resolve.mjs
      - name: Exact duplicate auto-resolve regression
        run: node tests/build131-exact-duplicate-conflict-auto-resolve.mjs
      - name: Re-run global carpet search regression
        run: node tests/build130-global-carpet-search.mjs
      - name: Re-run green Work save regression
        run: node tests/build128-operation-save-authority.mjs
