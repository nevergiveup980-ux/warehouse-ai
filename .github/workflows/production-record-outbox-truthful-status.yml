name: Production Record Outbox Truthful Status
on:
  pull_request:
    paths:
      - 'index.html'
      - 'tests/production-record-outbox-truthful-status.test.mjs'
      - 'tests/production-record-outbox-async-race.test.mjs'
      - 'tests/production-record-pull-async-guard.test.mjs'
      - '.github/workflows/production-record-outbox-truthful-status.yml'
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tests/production-record-outbox-truthful-status.test.mjs tests/production-record-outbox-async-race.test.mjs tests/production-record-pull-async-guard.test.mjs
