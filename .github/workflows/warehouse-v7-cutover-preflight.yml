name: Warehouse V7 Controlled Cutover Preflight
on:
  workflow_dispatch:
    inputs:
      expected_snapshot_md5:
        description: Optional approved V6 snapshot MD5 lock. Leave blank for engineering rehearsal.
        required: false
        type: string
  push:
    branches: [warehouse-v7-foundation]
    paths:
      - 'v7/cutover-preflight.py'
      - '.github/workflows/warehouse-v7-cutover-preflight.yml'

permissions:
  contents: read
  id-token: write

concurrency:
  group: warehouse-v7-controlled-cutover-preflight
  cancel-in-progress: true

jobs:
  preflight:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: warehouse_v7_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d warehouse_v7_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGPASSWORD: postgres
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: postgres
      PGDATABASE: warehouse_v7_test
      SNAPSHOT_URL: https://ekrnknlawekeoszzkamd.supabase.co/functions/v1/warehouse-v7-snapshot-bridge
      EXPECTED_SNAPSHOT_MD5: ${{ inputs.expected_snapshot_md5 || '' }}

    steps:
      - uses: actions/checkout@v4

      - name: Capture read-only V6 source at preflight start
        run: |
          set -euo pipefail
          OIDC_JSON="$(curl -fsS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=warehouse-v7-snapshot")"
          OIDC_TOKEN="$(python3 -c 'import json,sys; print(json.load(sys.stdin)["value"])' <<<"$OIDC_JSON")"
          curl -fsS --retry 3             -H "Authorization: Bearer $OIDC_TOKEN"             -H "Accept: application/json"             "$SNAPSHOT_URL"             -o /tmp/v7-preflight-start-envelope.json
          unset OIDC_TOKEN OIDC_JSON

          python3 - <<'PY'
          import json
          env=json.load(open('/tmp/v7-preflight-start-envelope.json'))
          rows=env.get('rows'); integ=env.get('source_integrity') or {}
          assert isinstance(rows,list) and rows
          assert len(rows)==int(integ.get('total_live_rows',-1))
          assert integ.get('algorithm')=='postgres-jsonb-row-md5-chain-v1'
          assert integ.get('postgres_jsonb_text_verified') is True
          json.dump(rows,open('/tmp/v7-preflight-start-rows.json','w'),separators=(',',':'))
          json.dump(integ,open('/tmp/v7-preflight-start-integrity.json','w'),indent=2)
          print('preflight source start:',integ.get('snapshot_md5'),len(rows))
          PY

      - name: Build and verify locked migration manifest
        id: manifest
        run: |
          set -euo pipefail
          node v7/snapshot-manifest-cli.mjs /tmp/v7-preflight-start-rows.json > /tmp/v7-preflight-manifest.json
          python3 - <<'PY'
          import json,os
          m=json.load(open('/tmp/v7-preflight-manifest.json'))
          edge=json.load(open('/tmp/v7-preflight-start-integrity.json'))
          got=m['source_integrity']
          assert got['snapshot_md5']==edge['snapshot_md5']
          assert got['total_live_rows']==edge['total_live_rows']
          edge_ds={x['dataset_key']:x for x in edge['datasets']}
          for k,v in got['datasets'].items():
              assert int(v['live_rows'])==int(edge_ds[k]['live_rows'])
              assert v['content_md5']==edge_ds[k]['content_md5']
          if os.environ.get('EXPECTED_SNAPSHOT_MD5'):
              assert got['snapshot_md5'].lower()==os.environ['EXPECTED_SNAPSHOT_MD5'].strip().lower(), 'APPROVED_SNAPSHOT_LOCK_MISMATCH'
          with open(os.environ['GITHUB_OUTPUT'],'a') as f:
              f.write('snapshot_md5='+got['snapshot_md5']+'\n')
          print('preflight source fingerprint verified:',got['snapshot_md5'])
          print('classification summary:',json.dumps(m['summary'],sort_keys=True))
          PY

      - name: Install disposable V7 database
        run: |
          set -euo pipefail
          psql -v ON_ERROR_STOP=1 -f v7/schema-2.0.sql
          psql -v ON_ERROR_STOP=1 -f v7/command-engine-1.0.sql
          psql -v ON_ERROR_STOP=1 -f v7/ledger-guards-1.0.sql
          psql -v ON_ERROR_STOP=1 -f v7/tenant-rls-1.0.sql
          psql -v ON_ERROR_STOP=1 -f v7/command-auth-1.0.sql
          psql -v ON_ERROR_STOP=1 -f v7/migration-staging-1.0.sql
          psql -v ON_ERROR_STOP=1 -f v7/cut-engine-1.0.sql
          psql -v ON_ERROR_STOP=1 -f v7/receiving-engine-1.0.sql
          psql -v ON_ERROR_STOP=1 -f v7/transfer-engine-1.0.sql
          psql -v ON_ERROR_STOP=1 -f v7/shipping-engine-1.0.sql
          psql -v ON_ERROR_STOP=1 -f v7/return-engine-1.0.sql

      - name: Run disposable V7 rehearsal
        run: |
          set -euo pipefail
          python3 v7/dry-run-loader.py /tmp/v7-preflight-manifest.json             --report /tmp/v7-preflight-dry-run-1.json             --expected-source-md5 "${{ steps.manifest.outputs.snapshot_md5 }}"             --tenant 55555555-5555-4555-8555-555555555555             --actor 66666666-6666-4666-8666-666666666666

      - name: Replay exact same snapshot into exact same disposable database
        run: |
          set -euo pipefail
          python3 v7/dry-run-loader.py /tmp/v7-preflight-manifest.json             --report /tmp/v7-preflight-dry-run-2.json             --expected-source-md5 "${{ steps.manifest.outputs.snapshot_md5 }}"             --tenant 55555555-5555-4555-8555-555555555555             --actor 66666666-6666-4666-8666-666666666666

      - name: Capture read-only V6 source again after rehearsal
        run: |
          set -euo pipefail
          OIDC_JSON="$(curl -fsS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=warehouse-v7-snapshot")"
          OIDC_TOKEN="$(python3 -c 'import json,sys; print(json.load(sys.stdin)["value"])' <<<"$OIDC_JSON")"
          curl -fsS --retry 3             -H "Authorization: Bearer $OIDC_TOKEN"             -H "Accept: application/json"             "$SNAPSHOT_URL"             -o /tmp/v7-preflight-end-envelope.json
          unset OIDC_TOKEN OIDC_JSON

          python3 - <<'PY'
          import json
          env=json.load(open('/tmp/v7-preflight-end-envelope.json'))
          rows=env.get('rows'); integ=env.get('source_integrity') or {}
          assert isinstance(rows,list) and rows
          assert len(rows)==int(integ.get('total_live_rows',-1))
          assert integ.get('algorithm')=='postgres-jsonb-row-md5-chain-v1'
          assert integ.get('postgres_jsonb_text_verified') is True
          json.dump(integ,open('/tmp/v7-preflight-end-integrity.json','w'),indent=2)
          print('preflight source end:',integ.get('snapshot_md5'),len(rows))
          PY

      - name: Evaluate automatic stop conditions
        run: |
          set -euo pipefail
          python3 v7/cutover-preflight.py             --start-integrity /tmp/v7-preflight-start-integrity.json             --end-integrity /tmp/v7-preflight-end-integrity.json             --dry-run-1 /tmp/v7-preflight-dry-run-1.json             --dry-run-2 /tmp/v7-preflight-dry-run-2.json             --report /tmp/v7-controlled-cutover-preflight-report.json             --expected-source-md5 "$EXPECTED_SNAPSHOT_MD5"

      - name: Upload sanitized preflight report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v7-controlled-cutover-preflight-report
          path: /tmp/v7-controlled-cutover-preflight-report.json
          if-no-files-found: ignore
          retention-days: 7

      - name: Destroy transient source and rehearsal files
        if: always()
        run: |
          rm -f             /tmp/v7-preflight-start-envelope.json             /tmp/v7-preflight-start-rows.json             /tmp/v7-preflight-start-integrity.json             /tmp/v7-preflight-manifest.json             /tmp/v7-preflight-dry-run-1.json             /tmp/v7-preflight-dry-run-2.json             /tmp/v7-preflight-end-envelope.json             /tmp/v7-preflight-end-integrity.json             /tmp/v7-controlled-cutover-preflight-report.json
