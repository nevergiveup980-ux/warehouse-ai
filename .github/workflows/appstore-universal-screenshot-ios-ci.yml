name: App Store Flooring Screenshot Gate

on:
  push:
    branches:
      - appstore/universal-ios-v1
    paths:
      - '.github/workflows/appstore-universal-screenshot-ios-ci.yml'
      - 'appstore/ios/package.json'
      - 'appstore/ios/scripts/generate-runlu-app-icon.swift'
      - 'appstore/ios/scripts/capture-simulator-dashboard.sh'
      - 'appstore/ios/scripts/build-screenshot-fixture.mjs'
      - 'appstore/ios/scripts/prepare-screenshot-scenes.mjs'
      - 'appstore/ios/scripts/verify-no-screenshot-fixture.mjs'
      - 'appstore/ios/scripts/sanitize-local-first-network.mjs'
      - 'appstore/ios/scripts/adapt-local-first-shell.mjs'
      - 'appstore/ios/scripts/brand-flooring-edition.mjs'
      - 'appstore/ios/scripts/disable-cloud-ai.mjs'
      - 'appstore/ios/scripts/sanitize-flooring-public-rules.mjs'
      - 'appstore/ios/scripts/polish-appstore-public-runtime.mjs'
      - 'appstore/ios/scripts/verify-public-polish.mjs'
      - 'universal/**'
      - 'universal-app.html'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  screenshot-ios:
    strategy:
      fail-fast: false
      matrix:
        family: [iphone, ipad]
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - name: Checkout App Store branch
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install App Store build dependencies
        working-directory: appstore/ios
        run: npm install --no-audit --no-fund

      - name: Syntax-check screenshot capture scripts
        working-directory: appstore/ios
        run: |
          node --check scripts/build-screenshot-fixture.mjs
          node --check scripts/prepare-screenshot-scenes.mjs
          node --check scripts/verify-no-screenshot-fixture.mjs
          node --check scripts/sanitize-local-first-network.mjs
          node --check scripts/adapt-local-first-shell.mjs
          node --check scripts/brand-flooring-edition.mjs
          node --check scripts/disable-cloud-ai.mjs
          node --check scripts/sanitize-flooring-public-rules.mjs
          node --check scripts/polish-appstore-public-runtime.mjs
          node --check scripts/verify-public-polish.mjs
          bash -n scripts/capture-simulator-dashboard.sh

      - name: Build verified shipping bundle first
        working-directory: appstore/ios
        run: npm run web:build

      - name: Build isolated fictional screenshot bundle
        working-directory: appstore/ios
        run: |
          node scripts/build-screenshot-fixture.mjs
          node scripts/prepare-screenshot-scenes.mjs
          test -f screenshot-www/screenshot-fixture.js
          test -f screenshot-www/screenshot-scenes.js
          grep -q 'RUNLU_SCREENSHOT_FIXTURE_V1' screenshot-www/screenshot-fixture.js
          grep -q 'runluAppStoreLocalFirstAccessGate' screenshot-www/universal-app.html
          grep -q 'runluAppStoreSafeArea' screenshot-www/universal/preview.html
          grep -q 'runluAppStorePageSafeArea' screenshot-www/universal/users.html
          grep -q 'runluAppStorePageSafeArea' screenshot-www/universal/backup.html
          grep -q '<h1>Warehouse OS</h1>' screenshot-www/universal-app.html
          grep -q '<p>Flooring Operations</p>' screenshot-www/universal-app.html
          grep -q '<strong>Scan / OCR</strong>' screenshot-www/universal-app.html
          grep -q 'screenshot-scenes.js' screenshot-www/universal/preview.html
          test ! -e www/screenshot-fixture.js
          test ! -e www/screenshot-scenes.js
          ! grep -q 'screenshot-scenes.js' www/universal/preview.html

      - name: Generate Capacitor iOS project
        working-directory: appstore/ios
        run: |
          rm -rf ios
          npx cap add ios
          npx cap sync ios

      - name: Apply Universal Invoice RUNLU App Icon
        working-directory: appstore/ios
        run: |
          ICONSET="ios/App/App/Assets.xcassets/AppIcon.appiconset"
          ICON="$ICONSET/AppIcon-512@2x.png"
          swift scripts/generate-runlu-app-icon.swift "$ICON"
          test -f "$ICON"
          test "$(sips -g pixelWidth "$ICON" | awk '/pixelWidth/{print $2}')" = "1024"
          test "$(sips -g pixelHeight "$ICON" | awk '/pixelHeight/{print $2}')" = "1024"
          test "$(sips -g hasAlpha "$ICON" | awk '/hasAlpha/{print $2}')" = "no"

      - name: Configure native permissions and release identity
        working-directory: appstore/ios
        env:
          RUNLU_MARKETING_VERSION: '1.0.0'
          RUNLU_BUILD_NUMBER: '1'
        run: |
          PLIST="ios/App/App/Info.plist"
          /usr/libexec/PlistBuddy -c "Add :NSCameraUsageDescription string Warehouse OS uses the camera when you choose to scan labels, barcodes, or warehouse documents." "$PLIST" || /usr/libexec/PlistBuddy -c "Set :NSCameraUsageDescription Warehouse OS uses the camera when you choose to scan labels, barcodes, or warehouse documents." "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :NSMicrophoneUsageDescription string Warehouse OS uses the microphone only when you choose local voice input." "$PLIST" || /usr/libexec/PlistBuddy -c "Set :NSMicrophoneUsageDescription Warehouse OS uses the microphone only when you choose local voice input." "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :NSSpeechRecognitionUsageDescription string Warehouse OS uses on-device speech recognition when you choose local voice input." "$PLIST" || /usr/libexec/PlistBuddy -c "Set :NSSpeechRecognitionUsageDescription Warehouse OS uses on-device speech recognition when you choose local voice input." "$PLIST"
          bash scripts/prepare-xcode-release.sh

      - name: Capture full App Store simulator screenshot story
        working-directory: appstore/ios
        env:
          RUNLU_SCREENSHOT_FAMILY: ${{ matrix.family }}
          RUNLU_SCREENSHOT_DIR: screenshots/raw/${{ matrix.family }}
          RUNLU_SCREENSHOT_DERIVED: ScreenshotDerivedData-${{ matrix.family }}
        run: bash scripts/capture-simulator-dashboard.sh

      - name: Verify eight screenshot masters
        working-directory: appstore/ios
        run: |
          test "$(find screenshots/raw/${{ matrix.family }} -maxdepth 1 -type f -name '*.jpg' | wc -l | tr -d ' ')" = "8"
          for scene in dashboard inventory carpet receiving transfer scan users backup; do
            find screenshots/raw/${{ matrix.family }} -maxdepth 1 -type f -name "*-${scene}.jpg" | grep -q .
          done
          for shot in screenshots/raw/${{ matrix.family }}/*.jpg; do
            test "$(sips -g hasAlpha "$shot" | awk '/hasAlpha/{print $2}')" = "no"
          done

      - name: Upload raw App Store screenshot capture
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: runlu-warehouse-raw-${{ matrix.family }}-screenshots
          path: appstore/ios/screenshots/raw/${{ matrix.family }}
          if-no-files-found: error
          retention-days: 7
