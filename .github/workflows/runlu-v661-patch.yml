name: Build RUNLU V6.6.1
on:
  push:
    branches:
      - v6.6.1-sync-responsive
    paths:
      - tools/patch_v661.py
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v6.6.1-sync-responsive
      - name: Apply V6.6.1 patch
        run: python3 tools/patch_v661.py
      - name: Validate release
        run: |
          grep -q "APP_VERSION='6.6.1'" index.html
          grep -q 'runlu-v661-sync-repair' index.html
          grep -q 'runlu-v661-responsive' index.html
          python3 -m json.tool version.json >/dev/null
      - name: Commit release
        run: |
          rm -f tools/patch_v661.py .github/workflows/runlu-v661-patch.yml
          git config user.name "RUNLU Release Builder"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Release V6.6.1 cloud merge and workstation layout"
          git push origin HEAD:v6.6.1-sync-responsive
