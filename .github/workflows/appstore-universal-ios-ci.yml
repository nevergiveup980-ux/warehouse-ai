name: App Store Universal iOS Gate

on:
  push:
    branches:
      - appstore/universal-ios-v1
  workflow_dispatch:

permissions:
  contents: read

jobs:
  distribution:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout App Store branch
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install build dependencies
        working-directory: appstore/ios
        run: npm install --no-audit --no-fund

      - name: Syntax-check distribution scripts
        working-directory: appstore/ios
        run: |
          node --check scripts/build-web.mjs
          node --check scripts/sanitize-local-first-network.mjs
          node --check scripts/adapt-local-first-shell.mjs
          node --check scripts/brand-flooring-edition.mjs
          node --check scripts/disable-cloud-ai.mjs
          node --check scripts/sanitize-flooring-public-rules.mjs
          node --check scripts/polish-appstore-public-runtime.mjs
          node --check scripts/verify-public-polish.mjs
          node --check scripts/verify-distribution.mjs
          node --check scripts/verify-no-screenshot-fixture.mjs
          node --check scripts/build-screenshot-fixture.mjs

      - name: Build and verify public App Store bundle
        working-directory: appstore/ios
        run: npm run web:build

      - name: Verify private, company-specific and production-cloud build files are absent
        working-directory: appstore/ios
        run: |
          test ! -e www/carpet_seed.js
          test ! -e www/screenshot-fixture.js
          for n in 072 073 074 088 090 094 095 096 097 098 099 100 101 102 103 104 107; do
            if find www -maxdepth 1 -type f -name "build${n}-*" | grep -q .; then
              echo "Private/company-specific/cloud Build${n} leaked into distribution"
              exit 1
            fi
          done
          if grep -E -q 'build073-hotfix|build074-hotfix|build107-scan-gateway-stop-snap' www/release-loader.js; then
            echo 'Excluded private/company-specific layer remains in release loader'
            exit 1
          fi
          if grep -R -n -E 'https://runlu-gpt-gateway\.nevergiveup980\.workers\.dev|https://warehouse\.runlu\.ca/|https://local-only\.invalid|https://universal-v1\.invalid/' www --include='*.html' --include='*.js' --exclude='tesseract.min.js'; then
            echo 'RUNLU-hosted cloud/gateway endpoint leaked into public runtime'
            exit 1
          fi
          if grep -R -n -E 'RUNLU_SCREENSHOT_FIXTURE_V1|Northstar Flooring Supply|PO-DEMO-001' www --include='*.html' --include='*.js' --include='*.json'; then
            echo 'Screenshot-only demo data leaked into shipping bundle'
            exit 1
          fi
          grep -q 'runluAppStoreLocalFirstAccessGate' www/universal-app.html
          grep -q 'runluAppStoreSafeArea' www/universal/preview.html
          grep -q '<strong>Scan / OCR</strong>' www/universal-app.html
          grep -q 'const BUILTIN_SUPPLIER_TEMPLATES=\[\];' www/universal-app.html
          if grep -q 'Connecting to Warehouse Cloud' www/universal-app.html; then
            echo 'Legacy warehouse-cloud boot copy remains in public runtime'
            exit 1
          fi

      - name: Upload verified web bundle
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: runlu-warehouse-appstore-web
          path: appstore/ios/www
          if-no-files-found: error
          retention-days: 7

      - name: Build isolated screenshot demo bundle
        if: success()
        working-directory: appstore/ios
        run: |
          node scripts/build-screenshot-fixture.mjs
          test -f screenshot-www/screenshot-fixture.js
          grep -q 'RUNLU_SCREENSHOT_FIXTURE_V1' screenshot-www/screenshot-fixture.js
          grep -q 'Northstar Flooring Supply' screenshot-www/screenshot-fixture.js
          test ! -e www/screenshot-fixture.js

      - name: Upload screenshot-only demo bundle
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: runlu-warehouse-screenshot-demo
          path: appstore/ios/screenshot-www
          if-no-files-found: error
          retention-days: 7
