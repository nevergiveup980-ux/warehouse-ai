name: App Store Universal iOS Gate

on:
  push:
    branches:
      - appstore/universal-ios-v1
  workflow_dispatch:

permissions:
  contents: read

jobs:
  distribution:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout App Store branch
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install build dependencies
        working-directory: appstore/ios
        run: npm install --no-audit --no-fund

      - name: Syntax-check distribution scripts
        working-directory: appstore/ios
        run: |
          node --check scripts/build-web.mjs
          node --check scripts/brand-flooring-edition.mjs
          node --check scripts/disable-cloud-ai.mjs
          node --check scripts/verify-distribution.mjs

      - name: Build and verify public App Store bundle
        working-directory: appstore/ios
        run: npm run web:build

      - name: Verify private and production-cloud build files are absent
        working-directory: appstore/ios
        run: |
          test ! -e www/carpet_seed.js
          for n in 072 088 090 094 095 096 097 098 099 100 101 102 103 104; do
            if find www -maxdepth 1 -type f -name "build${n}-*" | grep -q .; then
              echo "Private/cloud Build${n} leaked into distribution"
              exit 1
            fi
          done

      - name: Upload verified web bundle
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: runlu-warehouse-appstore-web
          path: appstore/ios/www
          if-no-files-found: error
          retention-days: 7
