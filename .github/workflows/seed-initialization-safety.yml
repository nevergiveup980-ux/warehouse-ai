name: Warehouse Seed Initialization Safety
on:
  pull_request:
    paths:
      - 'index.html'
      - 'tests/test_seed_initialization_safety.py'
      - '.github/workflows/seed-initialization-safety.yml'
  workflow_dispatch:
jobs:
  seed-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Seed initialization safety contracts
        run: python -m unittest discover -s tests -p test_seed_initialization_safety.py -v
