name: Warehouse Operation Save Build128

on:
  pull_request:
    paths:
      - 'build128-operation-save-authority.js'
      - 'release-loader.js'
      - 'version.json'
      - 'build082-version-authority.js'
      - 'tests/build128-operation-save-authority.mjs'
      - '.github/workflows/warehouse-operation-save-build128.yml'
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax check
        run: node --check build128-operation-save-authority.js
      - name: Operation save authority regression
        run: node tests/build128-operation-save-authority.mjs
