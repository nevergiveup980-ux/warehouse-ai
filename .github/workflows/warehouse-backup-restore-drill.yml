name: Warehouse disposable backup restore drill

on:
  pull_request:
    paths:
      - '.github/workflows/warehouse-backup-restore-drill.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backup-restore:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: testonly
          POSTGRES_DB: runlu_disposable
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d runlu_disposable"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGHOST: 127.0.0.1
      PGPORT: '5432'
      PGUSER: postgres
      PGPASSWORD: testonly
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install PostgreSQL client
        run: sudo apt-get update -qq && sudo apt-get install -y postgresql-client
      - name: Create representative inventory and operation ledger
        run: |
          psql -X -v ON_ERROR_STOP=1 -d runlu_disposable <<'SQL'
          CREATE TABLE warehouse_records(user_id uuid, dataset_key text, record_id text PRIMARY KEY, payload jsonb, version bigint, deleted_at timestamptz);
          CREATE TABLE warehouse_mutations(user_id uuid, operation_id uuid PRIMARY KEY, record_id text, status text, result jsonb);
          INSERT INTO warehouse_records VALUES
          ('11111111-1111-1111-1111-111111111111','runlu_carpet_inventory_v52','restore-a','{"roll":"R-100","manufacturerRoll":"M-100"}',1,NULL),
          ('11111111-1111-1111-1111-111111111111','runlu_carpet_inventory_v52','restore-b','{"roll":"R-101","manufacturerRoll":"M-101"}',3,NULL);
          INSERT INTO warehouse_mutations VALUES
          ('11111111-1111-1111-1111-111111111111','aaaaaaaa-aaaa-aaaa-aaaa-aaaaaaaaaaaa','restore-a','applied','{"status":"ok"}'),
          ('11111111-1111-1111-1111-111111111111','bbbbbbbb-bbbb-bbbb-bbbb-bbbbbbbbbbbb','restore-b','conflict','{"status":"conflict"}');
          SQL
      # Match the disposable server major version to the runner client to avoid
      # pg_restore emitting unsupported session parameters.
      - name: Dump and verify archive
        run: |
          pg_dump -Fc -d runlu_disposable -f /tmp/runlu-disposable.backup
          test -s /tmp/runlu-disposable.backup
          pg_restore -l /tmp/runlu-disposable.backup | grep -q warehouse_records
          pg_restore -l /tmp/runlu-disposable.backup | grep -q warehouse_mutations
      - name: Restore into separate empty database
        run: |
          createdb runlu_restored
          pg_restore --exit-on-error --no-owner --no-acl -d runlu_restored /tmp/runlu-disposable.backup
      - name: Compare inventory and operation ledger after restore
        run: |
          python3 - <<'PY'
          import subprocess
          def query(db, sql):
              return subprocess.check_output(['psql','-X','-At','-d',db,'-c',sql],text=True).strip()
          checks={
              'inventory':"SELECT record_id||'|'||version||'|'||payload::text FROM warehouse_records ORDER BY record_id",
              'ledger':"SELECT operation_id||'|'||status||'|'||result::text FROM warehouse_mutations ORDER BY operation_id",
          }
          for label,sql in checks.items():
              before=query('runlu_disposable',sql)
              after=query('runlu_restored',sql)
              assert before==after and before, f'{label} mismatch or empty after restore'
              print(f'PASS {label} dump/restore equality')
          print('PASS disposable backup restore drill')
          PY
