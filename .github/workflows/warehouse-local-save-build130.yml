name: Warehouse Local Save Build130

on:
  pull_request:
    paths:
      - 'build130-local-save-retry-authority.js'
      - 'release-loader.js'
      - 'version.json'
      - 'build082-version-authority.js'
      - 'tests/build130-local-save-retry-authority.mjs'
      - '.github/workflows/warehouse-local-save-build130.yml'
  workflow_dispatch:

jobs:
  build130-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: JavaScript syntax
        run: |
          node --check build130-local-save-retry-authority.js
          node --check build129-operation-draft-resilience.js
          node --check build082-version-authority.js
          node --check release-loader.js
      - name: Local save retry regression
        run: node tests/build130-local-save-retry-authority.mjs
      - name: Operation draft regression
        run: node tests/build129-operation-draft-resilience.mjs
