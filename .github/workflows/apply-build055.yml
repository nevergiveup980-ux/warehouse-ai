name: Apply RUNLU Build055

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-build055.yml'

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply Build055 patch
        shell: bash
        run: |
          set -euo pipefail
          PATCH_B64='[... ELLIPSIZATION ...]'
          printf '%s' "$PATCH_B64" | base64 -d | gzip -d > /tmp/build055.patch
          git apply --check /tmp/build055.patch
          git apply /tmp/build055.patch

      - name: Write Build055 version metadata
        shell: bash
        run: |
          cat > version.json <<'EOF'
          {
            "version": "6.5.4",
            "build": "055",
            "date": "2026-08-13",
            "channel": "stable",
            "notes": "Warehouse Active Scope + Move Inventory clarity. Active means physically present and available in the warehouse. Whole carpet rolls transferred from Warehouse to Store, Installer, Branch or Customer receive destination-specific external statuses and are excluded from current warehouse inventory. Transferred-out rolls remain history-visible and can become Active again after return to Warehouse. Move Inventory Record now clearly shows the current product and explains that the destination list intentionally excludes it."
          }
          EOF

      - name: Validate Build055
        shell: bash
        run: |
          set -euo pipefail
          grep -q "const APP_VERSION='6.5.4', APP_BUILD='055'" index.html
          grep -q "CURRENT PRODUCT ✓" index.html
          grep -q "Transferred Out" index.html
          grep -q "reconcileTransferredCarpetStatuses" index.html
          python -m json.tool version.json >/dev/null

      - name: Commit Build055 and remove one-time workflow
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/apply-build055.yml
          git config user.name "RUNLU Build Bot"
          git config user.email "actions@users.noreply.github.com"
          git add index.html version.json .github/workflows/apply-build055.yml
          git commit -m "Deploy RUNLU Warehouse V6.5.4 Build055"
          git push origin HEAD:main
