name: Apply RUNLU Build055

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-build055.yml'

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Activate Build055
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          s = s.replace("const APP_VERSION='6.5.2', APP_BUILD='053'", "const APP_VERSION='6.5.4', APP_BUILD='055'", 1)
          tag = '<script src="build055-hotfix.js"></script>'
          if tag not in s:
              s = s.replace('</body>', tag + '\n</body>', 1)
          p.write_text(s, encoding='utf-8')
          PY
          cat > version.json <<'EOF'
          {
            "version": "6.5.4",
            "build": "055",
            "date": "2026-08-13",
            "channel": "stable",
            "notes": "Warehouse Active Scope + Move Inventory clarity. Active means physically present and available in the warehouse. Whole carpet rolls transferred out of Warehouse are assigned destination-specific external statuses and excluded from current warehouse inventory. Move Inventory Record now clearly shows the current product and explains why it is excluded from the destination list."
          }
          EOF

      - name: Validate Build055
        shell: bash
        run: |
          set -euo pipefail
          test -s build055-hotfix.js
          grep -q "const APP_VERSION='6.5.4', APP_BUILD='055'" index.html
          grep -q '<script src="build055-hotfix.js"></script>' index.html
          grep -q 'CURRENT PRODUCT' build055-hotfix.js
          grep -q 'At Store' build055-hotfix.js
          python -m json.tool version.json >/dev/null

      - name: Commit Build055 and clean staging files
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .github/build055
          rm -f .github/workflows/apply-build055.yml
          git config user.name "RUNLU Build Bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Deploy RUNLU Warehouse V6.5.4 Build055"
          git push origin HEAD:main
