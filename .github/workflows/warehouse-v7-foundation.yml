name: Warehouse V7 Foundation
on:
  push: {branches: [warehouse-v7-foundation]}
  pull_request: {paths: ['v7/**','tests/v7-*.mjs','.github/workflows/warehouse-v7-foundation.yml']}
jobs:
  foundation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: node tests/v7-foundation-schema.mjs
      - run: node tests/v7-architecture-contracts.mjs
      - run: node tests/v7-schema-2.mjs
      - run: node tests/v7-command-engine.mjs
      - run: node tests/v7-cut-engine.mjs
      - run: node tests/v7-receiving-engine.mjs
      - run: node tests/v7-transfer-engine.mjs
      - run: node tests/v7-shipping-engine.mjs
      - run: node tests/v7-return-engine.mjs
      - run: node tests/v7-carpet-transfer-engine.mjs
      - run: node tests/v7-carpet-return-engine.mjs
      - run: node tests/v7-incremental-shadow-bridge.mjs
      - run: node tests/v7-core-lifecycle-attack.mjs
      - run: node tests/v7-snapshot-transformer.mjs
      - run: node tests/v7-snapshot-envelope.mjs
      - run: node tests/v7-inventory-alias-transformer.mjs
      - run: node tests/v7-product-unit-policy.mjs
      - name: Ensure V7 cannot touch V6 sync/cache architecture
        run: |
          ! grep -R --include="*.js" --include="*.ts" --include="*.sql" "runlu_cloud_master_offline_queue_v680\|warehouse_apply_mutation\|localStorage" v7
