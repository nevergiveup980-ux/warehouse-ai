<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>RUNLU Warehouse OS V7</title>
<style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#17212a;background:#f3f5f7;--navy:#14213d;--blue:#2563eb;--green:#17854b;--red:#b42335;--line:#dfe4e8;--muted:#68737d}*{box-sizing:border-box}body{margin:0;background:#f3f5f7}header{position:sticky;top:0;z-index:5;background:var(--navy);color:#fff;padding:12px 14px}.head{max-width:980px;margin:auto;display:flex;justify-content:space-between;align-items:center;gap:10px}h1{font-size:18px;margin:0}.ver{font-size:11px;background:#ffffff20;padding:6px 9px;border-radius:999px}main{max-width:980px;margin:auto;padding:12px 12px 90px}.banner,.card{background:#fff;border:1px solid var(--line);border-radius:15px;padding:13px;margin-bottom:10px}.banner.ok{background:#edf9f0;border-color:#b8dfc2}.banner.bad{background:#fff0f0;border-color:#efbcbc}.metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:10px}.metric{background:#fff;border:1px solid var(--line);border-radius:13px;padding:11px}.metric b{display:block;font-size:22px}.metric span,.muted{font-size:11px;color:var(--muted)}nav{display:flex;gap:6px;overflow:auto;margin:10px 0}button,.tab,input,select{font:inherit}.tab,button{border:0;border-radius:10px;padding:10px 12px;background:#e9edf3;color:#17212a;font-weight:750}.tab.active,button.primary{background:var(--blue);color:#fff}button.green{background:var(--green);color:#fff}.page{display:none}.page.active{display:block}.grid{display:grid;grid-template-columns:1fr 1fr;gap:9px}.row{display:grid;grid-template-columns:1fr 1fr;gap:8px}label{display:block;font-size:11px;color:var(--muted);margin:9px 0 4px}input,select{width:100%;border:1px solid var(--line);border-radius:10px;padding:11px;background:#fff}.item{border-top:1px solid var(--line);padding:11px 0}.item:first-child{border-top:0}.title{font-weight:850}.pill{display:inline-block;font-size:10px;border-radius:999px;padding:3px 7px;background:#edf2ff;margin:3px 4px 0 0}.warn{background:#fff1dd;color:#8b5a00}.danger{background:#fdeaea;color:#8b2929}.success{color:var(--green);font-weight:800}.actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:10px}.empty{color:var(--muted);padding:16px 0}.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:11px;word-break:break-all}@media(max-width:650px){.metrics,.grid,.row{grid-template-columns:1fr 1fr}.grid{grid-template-columns:1fr}.metric b{font-size:19px}}
</style></head><body><header><div class="head"><div><h1>RUNLU Warehouse OS</h1><div style="font-size:10px;opacity:.7">Production Command Center</div></div><span class="ver">V7 CORE</span></div></header><main>
<div id="banner" class="banner">Connecting to V7 production…</div><section class="metrics"><div class="metric"><b id="mStock">—</b><span>Stock items</span></div><div class="metric"><b id="mCarpet">—</b><span>Carpet rolls</span></div><div class="metric"><b id="mLoc">—</b><span>Locations</span></div><div class="metric"><b id="mOps">—</b><span>Recent ops</span></div></section>
<nav><button class="tab active" data-page="inventory">Inventory</button><button class="tab" data-page="receive">Receive</button><button class="tab" data-page="cut">Cut</button><button class="tab" data-page="transfer">Transfer</button><button class="tab" data-page="ship">Ship</button><button class="tab" data-page="return">Return</button><button class="tab" data-page="history">History</button></nav>
<section id="inventory" class="page active"><div class="card"><div class="row"><div><label>Search</label><input id="search" placeholder="Roll, product, colour, location"></div><div><label>Kind</label><select id="kind"><option>ALL</option><option>CARPET</option><option>STOCK</option></select></div></div></div><div id="inventoryList" class="grid"></div></section>
<section id="receive" class="page"><div class="card"><h3>Receive stock</h3><label>Product</label><select id="recvProduct"></select><label>Location</label><select id="recvLocation"></select><div class="row"><div><label>Quantity</label><input id="recvQty" type="number" min="0" step="0.01"></div><div><label>Unit</label><select id="recvUnit"><option>ROLL</option><option>PAIL</option><option>BUCKET</option><option>TUBE</option><option>GAL</option><option>BOX</option><option>EA</option></select></div></div><div class="actions"><button class="green" id="recvGo">Receive</button></div></div></section>
<section id="cut" class="page"><div class="card"><h3>Cut carpet</h3><label>Roll</label><select id="cutRoll"></select><div class="row"><div><label>Requested feet</label><input id="cutFt" type="number" min="0" step="1"></div><div><label>Requested inches</label><input id="cutIn" type="number" min="0" max="11" step="0.0625" value="0"></div></div><div id="cutRule" class="muted" style="margin-top:9px">Stock carpet deduction includes +3 inches.</div><div class="actions"><button class="green" id="cutGo">Commit cut</button></div></div></section>
<section id="transfer" class="page"><div class="card"><h3>Transfer</h3><label>Type</label><select id="xType"><option value="STOCK">Stock item — whole aggregate</option><option value="CARPET">Carpet — whole roll</option></select><label>Item</label><select id="xItem"></select><label>Destination</label><select id="xLocation"></select><div class="actions"><button class="green" id="xGo">Transfer</button></div></div></section>
<section id="ship" class="page"><div class="card"><h3>Ship stock</h3><label>Stock item</label><select id="shipItem"></select><label>Quantity</label><input id="shipQty" type="number" min="0" step="0.01"><div class="actions"><button class="green" id="shipGo">Ship</button></div></div></section>
<section id="return" class="page"><div class="card"><h3>Return shipped stock</h3><label>Original SHIP command</label><select id="retShip"></select><label>Return to location</label><select id="retLocation"></select><label>Quantity</label><input id="retQty" type="number" min="0" step="0.01"><div class="actions"><button class="green" id="retGo">Return</button></div></div></section>
<section id="history" class="page"><div class="card"><h3>Operations history</h3><div id="historyList"></div></div></section>
</main><script src="./production-api-client.js"></script><script>
(()=>{'use strict';const $=s=>document.querySelector(s),$$=s=>Array.from(document.querySelectorAll(s));let d=null;const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));const ft=s=>Math.round(Number(s||0)/192*100)/100;function banner(s,k=''){const e=$('#banner');e.textContent=s;e.className='banner '+k}function opt(rows,label){return rows.map(x=>'<option value="'+x.id+'">'+esc(label(x))+'</option>').join('')}function stockLabel(x){return x.product_name+(x.colour?' · '+x.colour:'')+' · '+(x.location_code||'No loc')+' · '+Number(x.quantity)+' '+x.unit}function carpetLabel(x){return x.roll_number+' · '+x.product_name+(x.colour?' '+x.colour:'')+' · '+(x.location_code||'No loc')+' · '+ft(x.remaining_sixteenths)+"'"}function fill(){if(!d)return;$('#mStock').textContent=d.stock.length;$('#mCarpet').textContent=d.carpet.length;$('#mLoc').textContent=d.locations.length;$('#mOps').textContent=d.recent.length;$('#recvProduct').innerHTML=opt(d.products,x=>x.name+(x.colour?' · '+x.colour:''));$('#recvLocation').innerHTML=opt(d.locations,x=>x.code);$('#cutRoll').innerHTML=opt(d.carpet,carpetLabel);$('#xLocation').innerHTML=$('#recvLocation').innerHTML;$('#retLocation').innerHTML=$('#recvLocation').innerHTML;$('#shipItem').innerHTML=opt(d.stock,stockLabel);const ships=d.recent.filter(x=>x.command_type==='SHIP'&&x.status==='committed'&&x.result?.stock_item_id);$('#retShip').innerHTML=ships.map(x=>'<option value="'+x.id+'">'+esc(x.id.slice(0,8)+' · '+(x.result?.shipped??'')+' '+(x.result?.unit??''))+'</option>').join('');refreshX();renderInventory();renderHistory()}function refreshX(){if(!d)return;const rows=$('#xType').value==='CARPET'?d.carpet:d.stock;$('#xItem').innerHTML=opt(rows,$('#xType').value==='CARPET'?carpetLabel:stockLabel)}function renderInventory(){if(!d)return;const q=$('#search').value.trim().toLowerCase(),k=$('#kind').value;let rows=[...d.carpet.map(x=>({...x,kind:'CARPET'})),...d.stock.map(x=>({...x,kind:'STOCK'}))];rows=rows.filter(x=>(k==='ALL'||x.kind===k)&&(!q||JSON.stringify(x).toLowerCase().includes(q)));$('#inventoryList').innerHTML=rows.map(x=>{if(x.kind==='CARPET'){const rem=ft(x.remaining_sixteenths),warn=x.measure_status==='CAL'&&rem<=50?'<span class="pill danger">TRUE MEASURE REQUIRED</span>':'';return '<div class="card"><div class="title">'+esc(x.roll_number)+'</div><div>'+esc(x.product_name)+(x.colour?' · '+esc(x.colour):'')+'</div><span class="pill">'+esc(x.measure_status)+'</span><span class="pill">'+esc(x.location_code||'No location')+'</span><span class="pill'+(rem<=50?' warn':'')+'">'+rem+"' remaining</span>"+warn+'</div>'}const low=Number(x.quantity)<=30;return '<div class="card"><div class="title">'+esc(x.product_name)+'</div>'+(x.colour?'<div>'+esc(x.colour)+'</div>':'')+'<span class="pill">'+esc(x.location_code||'No location')+'</span><span class="pill'+(low?' warn':'')+'">'+esc(x.quantity)+' '+esc(x.unit)+'</span></div>'}).join('')||'<div class="empty">No matching inventory.</div>'}function renderHistory(){if(!d)return;$('#historyList').innerHTML=d.recent.map(x=>'<div class="item"><div class="title">'+esc(x.command_type)+' · '+esc(x.status)+'</div><div class="muted">'+esc(new Date(x.created_at).toLocaleString())+'</div><div class="mono">'+esc(x.id)+'</div>'+(x.rejection_code?'<span class="pill danger">'+esc(x.rejection_code)+'</span>':'')+'</div>').join('')||'<div class="empty">No operations yet.</div>'}async function load(){try{d=await RUNLU_V7_API.bootstrap();fill();banner('V7 production connected · '+d.role+' · canonical Postgres source of truth','ok')}catch(e){banner(e.message==='SIGN_IN_REQUIRED'?'Sign in to Warehouse OS V6 once, then reopen V7.':'V7 connection failed: '+e.message,'bad')}}async function act(body,msg){if(!confirm(msg))return;banner('Committing V7 command…');try{const r=await RUNLU_V7_API.call(body);banner('Committed: '+(r.result?.status||'success'),'ok');await load()}catch(e){banner('Command stopped: '+e.message,'bad')}}$('#recvGo').onclick=()=>{const p=$('#recvProduct').value,l=$('#recvLocation').value,q=Number($('#recvQty').value),u=$('#recvUnit').value,existing=d.stock.find(x=>x.product_id===p&&x.location_id===l&&x.unit===u);act({action:'receive_stock',product_id:p,location_id:l,quantity:q,unit:u,stock_item_id:existing?.id||crypto.randomUUID(),expected_version:existing?.version||0,payload:{source:'V7_WEB'}},'Receive '+q+' '+u+' into V7?')};$('#cutGo').onclick=()=>{const r=d.carpet.find(x=>x.id===$('#cutRoll').value),feet=Number($('#cutFt').value),inch=Number($('#cutIn').value),ded=Math.round((feet*12+inch+3)*16);act({action:'cut_carpet',roll_id:r.id,expected_version:r.version,deduct_sixteenths:ded,payload:{requested_feet:feet,requested_inches:inch,stock_carpet_overage_inches:3,source:'V7_WEB'}},'Cut '+r.roll_number+'? Requested '+feet+"' "+inch+'" + 3" stock-carpet allowance.')};$('#xGo').onclick=()=>{const carpet=$('#xType').value==='CARPET',id=$('#xItem').value,row=(carpet?d.carpet:d.stock).find(x=>x.id===id);act({action:carpet?'transfer_carpet':'transfer_stock',[carpet?'roll_id':'stock_item_id']:id,expected_version:row.version,to_location_id:$('#xLocation').value,payload:{source:'V7_WEB'}},'Transfer '+(carpet?row.roll_number:row.product_name)+'?')};$('#shipGo').onclick=()=>{const row=d.stock.find(x=>x.id===$('#shipItem').value),q=Number($('#shipQty').value);act({action:'ship_stock',stock_item_id:row.id,expected_version:row.version,quantity:q,payload:{source:'V7_WEB'}},'Ship '+q+' '+row.unit+' of '+row.product_name+'?')};$('#retGo').onclick=()=>{const c=d.recent.find(x=>x.id===$('#retShip').value),s=d.stock.find(x=>x.id===c?.result?.stock_item_id),q=Number($('#retQty').value);if(!c||!s)return banner('Return source is no longer an active stock item.','bad');act({action:'return_stock',stock_item_id:s.id,expected_version:s.version,quantity:q,unit:s.unit,to_location_id:$('#retLocation').value,original_ship_command:c.id,payload:{source:'V7_WEB'}},'Return '+q+' '+s.unit+'?')};$('#xType').onchange=refreshX;$('#search').oninput=renderInventory;$('#kind').onchange=renderInventory;$$('.tab').forEach(b=>b.onclick=()=>{$$('.tab').forEach(x=>x.classList.remove('active'));$$('.page').forEach(x=>x.classList.remove('active'));b.classList.add('active');$('#'+b.dataset.page).classList.add('active')});load()})();
</script></body></html>
